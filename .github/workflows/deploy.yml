name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
          VITE_GOOGLE_FORM_ACTION_URL: ${{ vars.VITE_GOOGLE_FORM_ACTION_URL }}
          VITE_INVOICE_API_URL: ${{ vars.VITE_INVOICE_API_URL }}
          VITE_INVOICE_API_KEY: ${{ secrets.VITE_INVOICE_API_KEY }}
          VITE_ZALO_API_BASE_URL: ${{ vars.VITE_ZALO_API_BASE_URL }}
          VITE_ZALO_BOT_ID: ${{ vars.VITE_ZALO_BOT_ID }}
          VITE_ZALO_API_KEY: ${{ secrets.VITE_ZALO_API_KEY }}

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
