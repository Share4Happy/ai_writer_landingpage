<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg-grad)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Grid overlay -->
  <g opacity="0.1" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Brand Badge -->
  <rect x="100" y="100" width="220" height="44" rx="22" fill="#1e293b" stroke="url(#accent-grad)" stroke-width="1.5" />
  <text x="135" y="128" fill="#60a5fa" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700">NT AI WRITER</text>

  <!-- Heading -->
  <text x="100" y="240" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="52" font-weight="800">
    Từ Nghiên Cứu Từ Khóa Đến Đăng Bài
  </text>
  <text x="100" y="310" fill="url(#accent-grad)" font-family="'Plus Jakarta Sans', sans-serif" font-size="52" font-weight="800">
    Tự Động Chuẩn SEO Trong WordPress
  </text>

  <!-- Subtitle -->
  <text x="100" y="390" fill="#94a3b8" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="400">
    Plugin toàn diện: Gợi ý từ khóa, sinh tiêu đề, viết bài bằng AI và lên lịch tự động.
  </text>

  <!-- Feature Pills -->
  <rect x="100" y="470" width="260" height="50" rx="12" fill="#1e293b" />
  <text x="130" y="502" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="18">✓ Viết bài chuẩn SEO</text>

  <rect x="380" y="470" width="260" height="50" rx="12" fill="#1e293b" />
  <text x="410" y="502" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="18">✓ Đăng bài tự động</text>

  <rect x="660" y="470" width="280" height="50" rx="12" fill="#1e293b" />
  <text x="690" y="502" fill="#e2e8f0" font-family="'Plus Jakarta Sans', sans-serif" font-size="18">✓ Tích hợp WordPress</text>
</svg>
